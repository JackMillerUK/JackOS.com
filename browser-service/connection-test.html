<!doctype html><meta charset="utf-8"><title>JackOS Browser connection test</title><style>body{font:15px system-ui;margin:20px;background:#eee}form{display:flex;gap:10px}input{flex:1;padding:10px}iframe{background:white;width:100%;height:75vh;border:1px solid #aaa;margin-top:15px}button{padding:10px}p{color:#555}</style>
<h1>JackOS Browser connection test</h1><p>Start the local service, then load a public website here. This uses the same browser view as JackOS.</p><form><input aria-label="Website address" value="https://apple.com/uk"><button>Load website</button></form><p id="state">No page loaded</p><iframe title="Website" allow="fullscreen"></iframe>
<script>const frame=document.querySelector('iframe');document.querySelector('form').onsubmit=e=>{e.preventDefault();frame.src='view.html?url='+encodeURIComponent(document.querySelector('input').value);};window.addEventListener('message',e=>{if(e.origin===location.origin&&e.source===frame.contentWindow&&e.data?.type==='jackos-browser-state')document.getElementById('state').textContent=e.data.url;});</script>
