<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JackOS Browser</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:13px -apple-system,BlinkMacSystemFont,sans-serif}#stage{position:absolute;inset:0 0 30px}#screen{display:block;width:100%;height:100%;object-fit:fill;outline:0}#keyboard{position:fixed;left:0;top:0;width:1px;height:1px;opacity:.01;pointer-events:none}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:#f2f4f9;color:#26324b}#status[hidden],.modal[hidden],#downloads[hidden],#popup[hidden]{display:none}button,.download-link{padding:7px 13px;border:0;border-radius:6px;background:#0074e8;color:white;cursor:pointer;margin:4px;text-decoration:none}button:focus-visible,a:focus-visible{outline:2px solid #134db7;outline-offset:2px}.modal{position:absolute;inset:0;background:#16214066;display:grid;place-content:center;z-index:5}.modal>div{background:white;padding:24px;border-radius:14px;width:min(480px,90vw);max-height:85vh;overflow:auto}.modal p{white-space:pre-wrap;overflow-wrap:anywhere}#prompt,#copyText{padding:8px;width:100%}#tools{position:absolute;bottom:0;left:0;right:0;height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;background:#f4f5f8;border-top:1px solid #ddd;color:#555}#tools button{font:inherit;background:none;color:#274776;padding:3px 7px;margin:0}#downloads{position:absolute;right:8px;bottom:34px;background:white;box-shadow:0 4px 25px #0003;border:1px solid #ddd;border-radius:10px;padding:14px;width:min(400px,95vw);max-height:60vh;overflow:auto;z-index:4}.download-row{padding:10px 0;border-bottom:1px solid #eee;display:flex;flex-direction:column;gap:7px;overflow-wrap:anywhere}#popup{position:absolute;top:8px;right:8px;background:white;padding:10px;box-shadow:0 2px 12px #0003;border-radius:8px;z-index:3}#copyText{min-height:100px}
</style></head><body>
<div id="stage"><img id="screen" draggable="false" alt="Website rendered by JackOS Browser"><textarea id="keyboard" aria-label="Website keyboard input" autocomplete="off" autocapitalize="off" spellcheck="false"></textarea><div id="status" role="status"><h2>Connecting…</h2><p id="statusText">Starting the private browser session.</p><button id="reconnect" hidden>Reconnect</button></div></div>
<div id="tools"><span id="connection">Connecting</span><div><button id="copy">Copy selection</button><button id="downloadsButton">Downloads</button></div></div><section id="downloads" hidden aria-label="Downloads"></section><div id="popup" hidden></div>
<div id="dialog" class="modal" hidden role="dialog" aria-label="Website dialog"><div><p id="message"></p><input id="prompt"><button id="cancel">Cancel</button><button id="accept">OK</button></div></div>
<div id="uploadDialog" class="modal" hidden role="dialog" aria-label="Upload files"><div><h2>Choose files for this website</h2><p>Select up to 20 MB in total.</p><input id="upload" type="file" aria-label="Choose files"><p id="uploadError" role="alert"></p><button id="cancelUpload">Cancel</button></div></div>
<div id="copyDialog" class="modal" hidden role="dialog" aria-label="Copy selection"><div><p>Copy the selected website text:</p><textarea id="copyText" readonly></textarea><button id="closeCopy">Done</button></div></div>
<script src="wheel.js"></script><script src="boot.js"></script></body></html>
