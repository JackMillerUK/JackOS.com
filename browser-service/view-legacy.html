<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JackOS Browser</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#fff;font:14px -apple-system,BlinkMacSystemFont,sans-serif}#screen{display:block;width:100%;height:100%;object-fit:fill;outline:0}#status{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:#f2f4f9;color:#26324b}#status[hidden],#dialog[hidden]{display:none}button{padding:10px 18px;border:0;border-radius:8px;background:#007aff;color:white;cursor:pointer;margin:8px}#dialog{position:absolute;inset:0;background:#16214066;display:grid;place-content:center}#dialog>div{background:white;padding:24px;border-radius:14px;max-width:480px}#dialog p{white-space:pre-wrap;overflow-wrap:anywhere}#prompt{padding:8px;width:100%}
#upgrade{position:fixed;bottom:0;left:0;right:0;padding:6px 10px;background:#fff7d9;color:#604800;font-size:12px;text-align:center;pointer-events:none}</style></head><body><img id="screen" tabindex="0" alt="Website rendered by the local browser"><div id="status"><h2>Connecting to browser…</h2></div><div id="dialog" hidden><div><p id="message"></p><input id="prompt"><button id="cancel">Cancel</button><button id="accept">OK</button></div></div><div id="upgrade" role="status">Restart START-JACKOS.command to finish the browser update and enable smoother scrolling.</div><script src="wheel.js"></script><script src="view-legacy.js"></script></body></html>
